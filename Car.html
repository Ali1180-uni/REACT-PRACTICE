<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Rush 3D: Production Edition</title>
    <!-- Import Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Montserrat:ital,wght@0,400;0,700;1,900&display=swap');

        :root {
            --primary: #ff3366;
            --secondary: #00f3ff;
            --warning: #ffcc00;
            --success: #4cff76;
            --dark: #0f172a;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            transition: filter 0.3s ease;
        }

        /* HUD UI */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            padding: 2vw;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 5;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .score-board {
            display: flex;
            gap: 20px;
        }

        .hud-panel {
            background: rgba(15, 23, 42, 0.7);
            border-left: 4px solid var(--secondary);
            padding: 10px 20px;
            color: white;
            transform: skew(-10deg);
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .hud-panel span {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .hud-panel .value {
            font-family: 'Black Ops One', cursive;
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .hud-panel.danger { border-color: var(--primary); color: var(--primary); animation: pulse 1s infinite; }
        .hud-panel.turbo { border-color: var(--warning); color: var(--warning); }

        .meters {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: clamp(200px, 25vw, 300px);
        }

        .meter-container {
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .meter-label {
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .meter-track {
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .meter-fill {
            height: 100%;
            width: 100%;
            transform-origin: left;
            transition: transform 0.1s linear;
        }

        .fill-health { background: linear-gradient(90deg, #ff0055, #ff3366); }
        .fill-fuel { background: linear-gradient(90deg, #d97706, #fbbf24); }
        .fill-turbo { background: linear-gradient(90deg, #0284c7, #38bdf8); }

        /* Screens */
        .screen {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(15,23,42,0.8) 0%, rgba(0,0,0,0.95) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease, backdrop-filter 0.5s ease;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .hidden { opacity: 0; pointer-events: none; backdrop-filter: blur(0px); }

        .title {
            font-family: 'Black Ops One', cursive;
            font-size: clamp(3rem, 8vw, 6rem);
            color: transparent;
            -webkit-text-stroke: 2px var(--secondary);
            background: linear-gradient(180deg, #fff 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            margin: 0;
            text-align: center;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            transform: skew(-5deg);
        }

        .subtitle {
            color: var(--primary);
            font-size: 1.2rem;
            letter-spacing: 8px;
            font-weight: 900;
            margin-bottom: 40px;
            text-shadow: 2px 2px 0px #000;
        }

        .btn {
            background: transparent;
            color: white;
            border: 2px solid var(--secondary);
            padding: 15px 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px inset rgba(0,243,255,0.2), 0 0 15px rgba(0,243,255,0.2);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .btn:hover {
            background: var(--secondary);
            color: var(--dark);
            box-shadow: 0 0 30px var(--secondary);
            transform: scale(1.05);
        }

        .controls-hint {
            margin-top: 30px;
            color: #94a3b8;
            font-size: 0.85rem;
            display: flex;
            gap: 20px;
        }
        .key {
            background: rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            color: white;
            font-family: monospace;
        }

        /* Mobile Controls */
        .mobile-controls {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 35vh;
            display: none;
            pointer-events: auto;
            padding: 20px;
            box-sizing: border-box;
            z-index: 6;
        }

        .touch-zone {
            position: absolute;
            width: 50%; height: 100%;
            top: 0;
            display: flex;
            align-items: flex-end;
            padding: 20px;
            box-sizing: border-box;
        }

        .touch-zone.left { left: 0; justify-content: flex-start; }
        .touch-zone.right { right: 0; justify-content: flex-end; }

        .touch-btn {
            width: 80px; height: 80px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 24px;
            backdrop-filter: blur(5px);
            transition: background 0.1s;
        }
        .touch-btn:active { background: var(--secondary); color: #000; transform: scale(0.9); }

        .float-text {
            position: absolute;
            color: white;
            font-family: 'Black Ops One', cursive;
            font-size: 2rem;
            pointer-events: none;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.8);
            animation: floatUpFade 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 20;
            transform: translate(-50%, -50%);
        }

        @keyframes floatUpFade {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            50% { transform: translate(-50%, -100px) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -150px) scale(1); opacity: 0; }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 51, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); }
        }

        @media (max-width: 768px) {
            .mobile-controls { display: block; }
            .hud-top { flex-direction: column; gap: 10px; }
            .score-board { width: 100%; justify-content: space-between; }
            .controls-hint { display: none; }
            .ui-layer { padding-bottom: 30vh; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-layer">
        <div class="hud-top">
            <div class="score-board">
                <div class="hud-panel">
                    <span>SCORE</span>
                    <div class="value" id="ui-score">00000</div>
                </div>
                <div class="hud-panel" id="ui-speed-panel">
                    <span>SPEED</span>
                    <div class="value" id="ui-speed">0 <small style="font-size:1rem">MPH</small></div>
                </div>
            </div>
            <div class="meters">
                <div class="meter-container">
                    <div class="meter-label">INTEGRITY <span id="ui-hp-val">100%</span></div>
                    <div class="meter-track"><div class="meter-fill fill-health" id="ui-hp"></div></div>
                </div>
                <div class="meter-container">
                    <div class="meter-label">FUEL <span id="ui-fuel-val">100%</span></div>
                    <div class="meter-track"><div class="meter-fill fill-fuel" id="ui-fuel"></div></div>
                </div>
                <div class="meter-container">
                    <div class="meter-label">NITRO <span id="ui-turbo-val">RDY</span></div>
                    <div class="meter-track"><div class="meter-fill fill-turbo" id="ui-turbo"></div></div>
                </div>
            </div>
        </div>
        <div id="ui-paused" style="display:none; text-align:center; font-family:'Black Ops One'; font-size:4rem; color:white; text-shadow:0 0 20px var(--secondary); letter-spacing: 5px; margin: auto;">PAUSED</div>
    </div>

    <!-- Mobile Overlay -->
    <div class="mobile-controls">
        <div class="touch-zone left">
            <div style="display:flex; gap:10px;">
                <div class="touch-btn" id="btn-left">◀</div>
                <div class="touch-btn" id="btn-right">▶</div>
            </div>
        </div>
        <div class="touch-zone right">
            <div style="display:flex; gap:10px; flex-direction: column; align-items:flex-end;">
                <div class="touch-btn" id="btn-turbo" style="border-color:var(--secondary); color:var(--secondary);">⚡</div>
                <div style="display:flex; gap:10px;">
                    <div class="touch-btn" id="btn-brake" style="border-color:var(--primary); color:var(--primary);">🛑</div>
                    <div class="touch-btn" id="btn-gas" style="border-color:var(--success); color:var(--success);">▲</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="screen-start" class="screen">
        <h1 class="title">TURBO<br>RUSH</h1>
        <div class="subtitle">SUNSET OVERDRIVE</div>
        <button class="btn" onclick="GameApp.start()">IGNITE ENGINE</button>
        <div class="controls-hint">
            <span><span class="key">W/A/S/D</span> or <span class="key">ARROWS</span> to Drive</span>
            <span><span class="key">SPACE</span> Nitro</span>
            <span><span class="key">P</span> Pause</span>
        </div>
        <div style="margin-top:20px; color:#94a3b8; font-size:0.8rem;">HIGH SCORE: <span id="ui-highscore-start" style="color:var(--secondary); font-weight:bold;">0</span></div>
    </div>

    <!-- Game Over -->
    <div id="screen-gameover" class="screen hidden">
        <h1 class="title" style="background: linear-gradient(180deg, #fff 0%, var(--primary) 100%); -webkit-text-stroke: 2px var(--primary); text-shadow: 0 0 30px rgba(255, 51, 102, 0.4);">WRECKED</h1>
        <div class="hud-panel" style="margin: 30px 0; transform: none; text-align: center; padding: 20px 40px;">
            <span>FINAL SCORE</span>
            <div class="value" id="ui-final-score" style="font-size: 3rem; color: var(--secondary);">0</div>
        </div>
        <button class="btn" onclick="GameApp.start()">PLAY AGAIN</button>
    </div>
</div>

<script>
/**
 * AUDIO ENGINE (Synthesized - No external assets needed)
 * Uses Web Audio API to generate engine sounds, crashes, and blips.
 */
class SoundEngine {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.5;
        this.masterGain.connect(this.ctx.destination);
        this.engineOsc = null;
        this.engineGain = null;
        this.enabled = false;
    }

    init() {
        if(this.enabled) return;
        this.enabled = true;
        this.ctx.resume();
        
        // Continuous Engine Sound
        this.engineOsc = this.ctx.createOscillator();
        this.engineOsc.type = 'sawtooth';
        this.engineGain = this.ctx.createGain();
        this.engineGain.gain.value = 0; // Starts silent
        
        // Lowpass filter to muffle the harsh sawtooth
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 150;

        this.engineOsc.connect(filter);
        filter.connect(this.engineGain);
        this.engineGain.connect(this.masterGain);
        this.engineOsc.start();
    }

    updateEngine(speedRatio) {
        if(!this.enabled || !this.engineOsc) return;
        // Frequency rises with speed (idle at 40Hz, max 120Hz)
        const targetFreq = 40 + (speedRatio * 80);
        this.engineOsc.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.1);
        
        // Volume rises with speed
        const targetGain = 0.1 + (speedRatio * 0.2);
        this.engineGain.gain.setTargetAtTime(targetGain, this.ctx.currentTime, 0.1);
    }

    stopEngine() {
        if(this.engineGain) this.engineGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.5);
    }

    play(type) {
        if(!this.enabled) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);

        const now = this.ctx.currentTime;
        if(type === 'coin') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'crash') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'turbo') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.5);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.8);
            osc.start(now);
            osc.stop(now + 0.8);
        } else if (type === 'fuel') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(600, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }
    }
}

/**
 * MAIN GAME ENGINE
 * Architecture: ES6 Class holding state, logic, and Three.js rendering.
 */
class GameEngine {
    constructor() {
        // Core WebGL
        this.scene = null;
        this.camera = null;
        this.renderer = null;
        
        // Game State
        this.state = {
            active: false,
            paused: false,
            score: 0,
            highScore: localStorage.getItem('turbo_highscore') || 0,
            distance: 0,
            speed: 0,
            maxSpeed: 80, // Units per second
            acceleration: 40,
            braking: 60,
            friction: 15,
            health: 100,
            fuel: 100,
            turbo: 100,
            isTurbo: false,
            turboTimer: 0,
            lane: 1, // 0: Left, 1: Center, 2: Right
            targetX: 0
        };

        // Configuration
        this.LANE_WIDTH = 3.5;
        this.LANES = [-this.LANE_WIDTH, 0, this.LANE_WIDTH];
        this.COLORS = {
            sky: 0xff6b6b,
            fog: 0x2d1b4e,
            road: 0x1a1a2e,
            line: 0x00f3ff,
            player: 0xff0055,
            sun: 0xffd700
        };

        // Entities
        this.player = null;
        this.playerBox = new THREE.Box3(); // For collision
        this.enemies = [];
        this.items = [];
        this.particles = [];
        this.scenery = [];
        this.roadLines = [];
        
        // Systems
        this.audio = new SoundEngine();
        this.keys = { up: false, down: false, left: false, right: false, space: false };
        this.lastTime = 0;
        this.cameraShake = 0;
        
        // Bindings
        this.loop = this.loop.bind(this);
        this.onResize = this.onResize.bind(this);
        
        document.getElementById('ui-highscore-start').innerText = this.state.highScore;
    }

    init() {
        const container = document.getElementById('game-container');
        
        // Init Three.js
        this.scene = new THREE.Scene();
        this.scene.fog = new THREE.FogExp2(this.COLORS.fog, 0.008);
        this.scene.background = new THREE.Color(this.COLORS.sky);

        this.camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
        this.camera.position.set(0, 4, 8);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Perf optimization
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(this.renderer.domElement);

        this.buildWorld();
        this.bindEvents();
        
        // Start Render Loop
        requestAnimationFrame(this.loop);
    }

    buildWorld() {
        // Lighting: Sunset Vibe
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        this.scene.add(ambient);

        const dirLight = new THREE.DirectionalLight(0xffaa55, 1.2);
        dirLight.position.set(-20, 40, -40);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.camera.left = -20;
        dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        this.scene.add(dirLight);

        // The Sun
        const sunGeo = new THREE.CircleGeometry(60, 64);
        const sunMat = new THREE.MeshBasicMaterial({ color: this.COLORS.sun, fog: false });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(0, 10, -300);
        this.scene.add(sun);

        // Road Base
        const roadGeo = new THREE.PlaneGeometry(60, 600);
        const roadMat = new THREE.MeshStandardMaterial({ color: this.COLORS.road, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -200;
        road.receiveShadow = true;
        this.scene.add(road);

        // Neon Edges
        const edgeGeo = new THREE.BoxGeometry(0.5, 0.2, 600);
        const edgeMat = new THREE.MeshBasicMaterial({ color: this.COLORS.line });
        [-7, 7].forEach(x => {
            const edge = new THREE.Mesh(edgeGeo, edgeMat);
            edge.position.set(x, 0.1, -200);
            this.scene.add(edge);
        });

        // Moving Lane Lines
        const lineGeo = new THREE.PlaneGeometry(0.2, 3);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
        for(let i=0; i<30; i++) {
            [-this.LANE_WIDTH/2, this.LANE_WIDTH/2].forEach(x => {
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(x, 0.02, -i * 10);
                this.scene.add(line);
                this.roadLines.push(line);
            });
        }

        // Procedural Mountains (Low Poly)
        const mountGeo = new THREE.PlaneGeometry(400, 100, 30, 10);
        const pos = mountGeo.attributes.position.array;
        for(let i = 0; i < pos.length; i+=3) {
            if(pos[i+1] > 0) pos[i+1] = Math.random() * 40;
        }
        mountGeo.computeVertexNormals();
        const mountMat = new THREE.MeshStandardMaterial({ 
            color: 0x1a0b2e, flatShading: true, roughness: 1 
        });
        const mountains = new THREE.Mesh(mountGeo, mountMat);
        mountains.position.set(0, -5, -280);
        this.scene.add(mountains);

        // Create Player Car (Retro Arcade Style)
        this.player = new THREE.Group();
        
        const bodyGeo = new THREE.BoxGeometry(1.8, 0.5, 4);
        const bodyMat = new THREE.MeshPhongMaterial({ color: this.COLORS.player, shininess: 100 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.5;
        body.castShadow = true;
        this.player.add(body);

        const cabGeo = new THREE.BoxGeometry(1.4, 0.4, 1.8);
        const cabMat = new THREE.MeshPhongMaterial({ color: 0x111111, shininess: 150 });
        const cab = new THREE.Mesh(cabGeo, cabMat);
        cab.position.set(0, 0.95, -0.2);
        this.player.add(cab);

        // Spoiler
        const spoilGeo = new THREE.BoxGeometry(2, 0.1, 0.5);
        const spoil = new THREE.Mesh(spoilGeo, bodyMat);
        spoil.position.set(0, 1.1, 1.8);
        this.player.add(spoil);
        const sLeg1 = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.4,0.2), bodyMat);
        sLeg1.position.set(-0.7, 0.8, 1.7);
        const sLeg2 = sLeg1.clone();
        sLeg2.position.set(0.7, 0.8, 1.7);
        this.player.add(sLeg1, sLeg2);

        this.scene.add(this.player);
    }

    bindEvents() {
        window.addEventListener('resize', this.onResize);
        
        // Keyboard Map
        const keyMap = {
            'ArrowUp': 'up', 'KeyW': 'up',
            'ArrowDown': 'down', 'KeyS': 'down',
            'ArrowLeft': 'left', 'KeyA': 'left',
            'ArrowRight': 'right', 'KeyD': 'right',
            'Space': 'space'
        };

        const handleKey = (e, isDown) => {
            if(e.code === 'KeyP' && isDown) this.togglePause();
            if(keyMap[e.code]) this.keys[keyMap[e.code]] = isDown;
        };

        window.addEventListener('keydown', e => handleKey(e, true));
        window.addEventListener('keyup', e => handleKey(e, false));

        // Mobile Controls Map
        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            if(!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[key] = false; });
        };
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-gas', 'up');
        bindTouch('btn-brake', 'down');
        bindTouch('btn-turbo', 'space');
    }

    start() {
        this.audio.init();
        
        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-gameover').classList.add('hidden');
        this.scene.fog.color.setHex(this.COLORS.fog);
        
        // Reset State
        this.state = {
            ...this.state,
            active: true, paused: false,
            score: 0, distance: 0, speed: 0,
            health: 100, fuel: 100, turbo: 100,
            isTurbo: false, turboTimer: 0,
            lane: 1, targetX: 0
        };

        this.player.position.set(0, 0, 0);
        this.player.rotation.set(0,0,0);
        this.camera.position.set(0, 4, 8);
        this.cameraShake = 0;
        this.lastTime = performance.now();

        // Clear arrays
        [...this.enemies, ...this.items, ...this.particles].forEach(obj => this.scene.remove(obj.mesh));
        this.enemies = []; this.items = []; this.particles = [];
        
        this.updateUI();
    }

    stop() {
        this.state.active = false;
        this.audio.stopEngine();
        
        // High Score
        if(this.state.score > this.state.highScore) {
            this.state.highScore = Math.floor(this.state.score);
            localStorage.setItem('turbo_highscore', this.state.highScore);
        }
        
        document.getElementById('ui-final-score').innerText = Math.floor(this.state.score);
        document.getElementById('screen-gameover').classList.remove('hidden');
        
        // Red flash effect
        this.scene.fog.color.setHex(0xff0000);
    }

    togglePause() {
        if(!this.state.active) return;
        this.state.paused = !this.state.paused;
        document.getElementById('ui-paused').style.display = this.state.paused ? 'block' : 'none';
        if(this.state.paused) {
            this.audio.stopEngine();
        } else {
            this.lastTime = performance.now(); // Prevent large dt
        }
    }

    // --- GAME LOGIC (Framerate Independent via dt) ---

    updatePhysics(dt) {
        // 1. Calculate Speed based on inputs
        this.state.isTurbo = false;
        let currentMax = this.state.maxSpeed;

        if (this.keys.space && this.state.turbo > 0 && this.state.speed > 20) {
            this.state.isTurbo = true;
            this.state.turbo -= 30 * dt; // Drain turbo
            currentMax *= 1.5;
            this.camera.fov = THREE.MathUtils.lerp(this.camera.fov, 85, dt * 5);
            if(Math.random() < 0.3) this.spawnExhaust(); // Visual flair
        } else {
            this.state.turbo = Math.min(100, this.state.turbo + 5 * dt); // Recharge slowly
            this.camera.fov = THREE.MathUtils.lerp(this.camera.fov, 65, dt * 5);
        }
        this.camera.updateProjectionMatrix();

        if (this.keys.up && this.state.fuel > 0) {
            this.state.speed += this.state.acceleration * dt * (this.state.isTurbo ? 2 : 1);
        } else if (this.keys.down) {
            this.state.speed -= this.state.braking * dt;
        } else {
            this.state.speed -= this.state.friction * dt; // Coasting
        }

        // Clamp speed
        this.state.speed = Math.max(0, Math.min(this.state.speed, currentMax));
        
        // Fuel drain
        if(this.state.speed > 0) {
            this.state.fuel -= (0.5 + (this.state.speed * 0.02)) * dt;
            if(this.state.fuel <= 0) {
                this.state.fuel = 0;
                this.state.speed -= this.state.braking * 0.5 * dt; // Force slow down
            }
        }

        // 2. Lateral Movement (Lane switching)
        if (this.keys.left && this.state.lane > 0 && !this.player.userData.changing) {
            this.state.lane--;
            this.startLaneChange();
        }
        if (this.keys.right && this.state.lane < 2 && !this.player.userData.changing) {
            this.state.lane++;
            this.startLaneChange();
        }

        this.state.targetX = this.LANES[this.state.lane];
        // Lerp player X and Roll for smooth arcade feel
        this.player.position.x = THREE.MathUtils.lerp(this.player.position.x, this.state.targetX, dt * 10);
        const tiltTarget = (this.state.targetX - this.player.position.x) * -0.15;
        this.player.rotation.z = THREE.MathUtils.lerp(this.player.rotation.z, tiltTarget, dt * 10);

        // Update Bounding Box for precise collision
        this.playerBox.setFromObject(this.player);

        // Update Audio
        this.audio.updateEngine(this.state.speed / this.state.maxSpeed);
    }

    startLaneChange() {
        this.player.userData.changing = true;
        setTimeout(() => this.player.userData.changing = false, 150);
    }

    updateEntities(dt) {
        const moveDist = this.state.speed * dt;
        this.state.distance += moveDist;
        this.state.score += moveDist * 0.1;

        // Animate Road Lines
        this.roadLines.forEach(line => {
            line.position.z += moveDist;
            if(line.position.z > 5) line.position.z -= 300;
        });

        // SPAWNING SYSTEM
        // Dynamic spawn rate based on speed
        const spawnChance = 0.5 + (this.state.speed * 0.01); 
        if(Math.random() < spawnChance * dt) {
            if(Math.random() > 0.3) this.spawnEnemy();
            else this.spawnItem();
        }

        // UPDATE ENEMIES
        for (let i = this.enemies.length - 1; i >= 0; i--) {
            const e = this.enemies[i];
            // Enemies move at their own speed relative to world, player speed moves world
            const relSpeed = moveDist - (e.speed * dt); 
            e.mesh.position.z += relSpeed;
            e.box.setFromObject(e.mesh); // Update AABB

            // Collision Check (AABB Intersection)
            if (this.playerBox.intersectsBox(e.box) && !e.hit) {
                e.hit = true;
                const damage = e.isTruck ? 30 : 15;
                this.state.health -= damage;
                this.state.speed *= 0.4; // Crash penalty
                this.cameraShake = 0.5;
                this.audio.play('crash');
                this.createExplosion(e.mesh.position, 0xffaa00);
                this.showFloatingText(`-${damage} HP`, '#ff3366');
                
                if (this.state.health <= 0) {
                    this.state.health = 0;
                    this.stop();
                    return; // End loop
                }
            }

            // Cleanup
            if (e.mesh.position.z > 15) {
                this.scene.remove(e.mesh);
                this.enemies.splice(i, 1);
                this.state.score += 5; // Dodge bonus
            }
        }

        // UPDATE ITEMS
        for (let i = this.items.length - 1; i >= 0; i--) {
            const item = this.items[i];
            item.mesh.position.z += moveDist;
            item.mesh.rotation.y += 3 * dt;
            item.mesh.rotation.x += 2 * dt;
            item.box.setFromObject(item.mesh);

            if (this.playerBox.intersectsBox(item.box)) {
                this.audio.play(item.type === 'coin' ? 'coin' : (item.type === 'fuel' ? 'fuel' : 'turbo'));
                this.createExplosion(item.mesh.position, item.mesh.material.color.getHex(), 10);
                
                if(item.type === 'coin') {
                    this.state.score += 500;
                    this.showFloatingText('+500', '#ffd700');
                } else if(item.type === 'fuel') {
                    this.state.fuel = Math.min(100, this.state.fuel + 40);
                    this.showFloatingText('+FUEL', '#4cff76');
                } else {
                    this.state.turbo = Math.min(100, this.state.turbo + 50);
                    this.showFloatingText('NITRO!', '#00f3ff');
                }
                
                this.scene.remove(item.mesh);
                this.items.splice(i, 1);
                continue;
            }

            if (item.mesh.position.z > 15) {
                this.scene.remove(item.mesh);
                this.items.splice(i, 1);
            }
        }

        // UPDATE PARTICLES
        for(let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.mesh.position.addScaledVector(p.vel, dt);
            p.mesh.material.opacity -= dt * 2;
            p.mesh.scale.multiplyScalar(0.95);
            if(p.mesh.material.opacity <= 0) {
                this.scene.remove(p.mesh);
                this.particles.splice(i, 1);
            }
        }
    }

    // --- SPANWERS & FX ---

    spawnEnemy() {
        // Prevent spawning too close to another entity in the same lane
        const lane = Math.floor(Math.random() * 3);
        const zPos = -150 - Math.random() * 50;
        
        const tooClose = this.enemies.some(e => e.lane === lane && Math.abs(e.mesh.position.z - zPos) < 20);
        if(tooClose) return;

        const isTruck = Math.random() > 0.8;
        const color = isTruck ? 0x555555 : new THREE.Color().setHSL(Math.random(), 0.8, 0.5).getHex();
        const width = isTruck ? 2.2 : 1.6;
        const length = isTruck ? 5.5 : 3.5;
        const height = isTruck ? 2.5 : 1.2;

        const geo = new THREE.BoxGeometry(width, height, length);
        const mat = new THREE.MeshPhongMaterial({ color, shininess: 50 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(this.LANES[lane], height/2, zPos);
        mesh.castShadow = true;
        this.scene.add(mesh);

        this.enemies.push({
            mesh,
            box: new THREE.Box3(),
            lane: lane,
            speed: isTruck ? 30 : 45 + Math.random() * 20,
            isTruck,
            hit: false
        });
    }

    spawnItem() {
        const lane = Math.floor(Math.random() * 3);
        const zPos = -150;
        const tooClose = this.items.some(i => i.lane === lane && Math.abs(i.mesh.position.z - zPos) < 10);
        if(tooClose) return;

        const roll = Math.random();
        let type = 'coin', color = 0xffd700, geo = new THREE.TorusGeometry(0.5, 0.15, 8, 16);
        
        if(roll > 0.85) { type = 'nitro'; color = 0x00f3ff; geo = new THREE.OctahedronGeometry(0.6, 0); }
        else if(roll > 0.65) { type = 'fuel'; color = 0x4cff76; geo = new THREE.BoxGeometry(0.8, 0.8, 0.8); }

        const mat = new THREE.MeshPhongMaterial({ color, emissive: color, emissiveIntensity: 0.5, shininess: 100 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(this.LANES[lane], 1.5, zPos);
        this.scene.add(mesh);

        this.items.push({ mesh, box: new THREE.Box3(), type, lane });
    }

    createExplosion(pos, colorHex, count = 20) {
        const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true });
        for(let i=0; i<count; i++) {
            const mesh = new THREE.Mesh(geo, mat.clone());
            mesh.position.copy(pos);
            mesh.position.y += Math.random();
            this.scene.add(mesh);
            this.particles.push({
                mesh,
                vel: new THREE.Vector3((Math.random()-0.5)*15, Math.random()*15, (Math.random()-0.5)*15)
            });
        }
    }

    spawnExhaust() {
        const geo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const mat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, transparent: true });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(this.player.position);
        mesh.position.z += 2; // back of car
        mesh.position.y += 0.2;
        mesh.position.x += (Math.random()-0.5)*1.5;
        this.scene.add(mesh);
        this.particles.push({
            mesh,
            vel: new THREE.Vector3(0, Math.random()*2, Math.random()*10 + 10)
        });
    }

    // --- UI & RENDERING ---

    updateUI() {
        document.getElementById('ui-score').innerText = Math.floor(this.state.score).toString().padStart(5, '0');
        
        // Convert internal speed to realistic looking MPH
        const displaySpeed = Math.floor((this.state.speed / this.state.maxSpeed) * 160);
        document.getElementById('ui-speed').innerHTML = `${displaySpeed} <small style="font-size:1rem">MPH</small>`;
        
        const hpEl = document.getElementById('ui-hp');
        const fuelEl = document.getElementById('ui-fuel');
        hpEl.style.transform = `scaleX(${Math.max(0, this.state.health)/100})`;
        fuelEl.style.transform = `scaleX(${Math.max(0, this.state.fuel)/100})`;
        document.getElementById('ui-turbo').style.transform = `scaleX(${Math.min(100, this.state.turbo)/100})`;

        document.getElementById('ui-hp-val').innerText = `${Math.floor(this.state.health)}%`;
        document.getElementById('ui-fuel-val').innerText = `${Math.floor(this.state.fuel)}%`;
        document.getElementById('ui-turbo-val').innerText = this.state.turbo >= 100 ? 'RDY' : `${Math.floor(this.state.turbo)}%`;

        const speedPanel = document.getElementById('ui-speed-panel');
        if(this.state.isTurbo) speedPanel.className = 'hud-panel turbo';
        else if(this.state.health < 30 || this.state.fuel < 20) speedPanel.className = 'hud-panel danger';
        else speedPanel.className = 'hud-panel';
    }

    showFloatingText(text, color) {
        const el = document.createElement('div');
        el.className = 'float-text';
        el.innerText = text;
        el.style.color = color;
        el.style.left = (window.innerWidth / 2) + ((Math.random()-0.5)*100) + 'px';
        el.style.top = (window.innerHeight / 2) + ((Math.random()-0.5)*100) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    loop(timestamp) {
        requestAnimationFrame(this.loop);
        
        // Calculate Delta Time (cap at 0.1s to prevent physics explosions if tab inactive)
        let dt = (timestamp - this.lastTime) / 1000;
        if(dt > 0.1) dt = 0.1; 
        this.lastTime = timestamp;

        if(!this.state.active || this.state.paused) {
            this.renderer.render(this.scene, this.camera);
            return;
        }

        this.updatePhysics(dt);
        this.updateEntities(dt);
        this.updateUI();

        // Camera Follow & Shake
        const camTargetX = this.player.position.x * 0.5;
        this.camera.position.x = THREE.MathUtils.lerp(this.camera.position.x, camTargetX, dt * 5);
        
        if(this.cameraShake > 0) {
            this.camera.position.x += (Math.random() - 0.5) * this.cameraShake;
            this.camera.position.y = 4 + (Math.random() - 0.5) * this.cameraShake;
            this.cameraShake -= dt;
            if(this.cameraShake < 0) { this.cameraShake = 0; this.camera.position.y = 4; }
        }

        this.renderer.render(this.scene, this.camera);
    }

    onResize() {
        if(!this.camera || !this.renderer) return;
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
    }
}

// Bootstrap
const GameApp = new GameEngine();
window.onload = () => {
    GameApp.init();
};

</script>
